<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico 2 W Async Shell</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        #terminal {
            max-width: 800px;
            margin: 0 auto;
        }
        #output {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        #prompt {
            margin-right: 10px;
            white-space: nowrap;
        }
        #cmd {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            padding: 0;
        }
    </style>
</head>
<body>

<div id="terminal">
    <div id="output">Pico 2 W Shell Initialized. Waiting for connection...</div>
    <div id="input-line">
        <span id="prompt">pico-shell></span>
        <input type="text" id="cmd" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const cmdInput = document.getElementById('cmd');
    
    let history = [];
    let historyIndex = -1;

    // Keep focus on the text input area when clicking inside the window
    document.addEventListener('click', () => cmdInput.focus());

    // Continuous listening engine (Long Polling)
    async function listenForBackendUpdates() {
        try {
            // This fetch hangs until the Pico sends data or a timeout occurs
            const response = await fetch('/listen.shtml');
            if (response.ok) {
                const text = await response.text();
                if (text.length > 0) {
                    output.textContent += text;
                    window.scrollTo(0, document.body.scrollHeight);
                }
            }
        } catch (err) {
            // Fail silently on network drops; the timeout restarts the pipe
        }
        
        // Instantly re-open the listening channel to wait for the next update
        setTimeout(listenForBackendUpdates, 50);
    }

    // Command submission handler
    cmdInput.addEventListener('keydown', async function(e) {
        if (e.key === 'Enter') {
            const command = this.value.trim();
            if (!command) return;

            // Echo local typing input out to display window
            output.textContent += `\npico-shell> ${command}\n`;
            this.value = '';

            // Update local command up/down history arrays
            history.push(command);
            historyIndex = history.length;

            try {
                // Send command payload over a fast POST route
                await fetch('/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: command
                });
            } catch (err) {
                output.textContent += "System Error: Unable to route command payload.\n";
            }
            
            window.scrollTo(0, document.body.scrollHeight);
        } 
        
        // Command history navigation (Up Arrow)
        else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                this.value = history[historyIndex];
            }
        } 
        
        // Command history navigation (Down Arrow)
        else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex < history.length - 1) {
                historyIndex++;
                this.value = history[historyIndex];
            } else {
                historyIndex = history.length;
                this.value = '';
            }
        }
    });

    // Fire up the listener loop as soon as page structures boot
    output.textContent = "Shell Ready. Waiting for data...\n";
    listenForBackendUpdates();
</script>

</body>
</html>
