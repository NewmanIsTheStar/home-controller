<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico 2 W Async Shell</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
        }
        ::selection {
            background: #00ff00;
            color: #121212;
        }
        ::-moz-selection {
            background: #00ff00;
            color: #121212;
        }
        #terminal {
            max-width: 1000px;
            margin: 0 auto;
        }
        #output {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
        }
        #input-line {
            display: flex;
            align-items: center;
        }
        #prompt {
            margin-right: 10px;
            white-space: nowrap;
        }
        #cmd {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
            flex-grow: 1;
            outline: none;
            padding: 0;
        }
    </style>
</head>
<body>

<div id="terminal">
    <div id="output">Pico 2 W Shell Initialized. Waiting for connection...</div>
    <div id="input-line">
        <span id="prompt">pico-shell></span>
        <input type="text" id="cmd" autofocus autocomplete="off" spellcheck="false">
    </div>
</div>

<script>
    const output = document.getElementById('output');
    const cmdInput = document.getElementById('cmd');
    
    let history = [];
    let historyIndex = -1;

    // Word Dictionary (mix of commands and paths/files)
    let serverCommands = [
        'help', 'status', 'edit', 'reboot', 'ls', 'cat', 'rm',
        'main.py', 'boot.py', 'lib/', 'lib/asyncio/', 'config.json', 'data.csv'
    ]; 
    let matchingCommands = [];
    let completionIndex = 0;
    let currentPrefix = '';
    let commandPrefixStr = ''; // Stores everything before the word being completed
    let lastTabPrintedList = false; // Prevents spamming match list on multi-tabs

    // Fetch dictionary from server on startup
    async function loadCompletionWords() {
        try {
            const response = await fetch('/commands.json');
            if (response.ok) {
                serverCommands = await response.json();
            }
        } catch (err) {}
    }

    // Refocus on click if user isn't highlighting text
    document.addEventListener('click', (e) => {
        const selection = window.getSelection().toString();
        if (!selection && e.target !== cmdInput) {
            cmdInput.focus();
        }
    });

    // Auto-focus input when typing alphanumeric keys anywhere
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.altKey || e.metaKey || e.key.startsWith('Arrow') || e.key === 'Tab') {
            return;
        }
        if (document.activeElement !== cmdInput) {
            cmdInput.focus();
        }
    });

    // Reset completion loops on normal input typing
    cmdInput.addEventListener('input', () => {
        matchingCommands = [];
        completionIndex = 0;
        currentPrefix = '';
        commandPrefixStr = '';
        lastTabPrintedList = false;
    });

    // Ctrl + Shift + C clipboard shortcut
    document.addEventListener('keydown', async (e) => {
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
            e.preventDefault();
            const selectedText = window.getSelection().toString();
            if (selectedText) {
                try {
                    await navigator.clipboard.writeText(selectedText);
                } catch (err) {
                    console.error("Failed to copy text: ", err);
                }
            }
        }
    });

    // Continuous listening engine (Long Polling)
    async function listenForBackendUpdates() {
        try {
            const response = await fetch('/listen.shtml');
            if (response.ok) {
                const text = await response.text();
                if (text.length > 0) {
                    output.textContent += text;
                    window.scrollTo(0, document.body.scrollHeight);
                }
            }
        } catch (err) {}
        setTimeout(listenForBackendUpdates, 50);
    }

    // Input handlers
    cmdInput.addEventListener('keydown', async function(e) {
        // Smart Tab Completion Engine Interceptor
        if (e.key === 'Tab') {
            e.preventDefault();

            const currentInputValue = this.value;
            
            // Build matches on the first tab press
            if (matchingCommands.length === 0) {
                // Parse out the last word for path/argument completion support
                const words = currentInputValue.split(' ');
                currentPrefix = words[words.length - 1];
                
                // Reconstruct the immutable baseline string before our target token
                commandPrefixStr = words.slice(0, words.length - 1).join(' ');
                if (commandPrefixStr.length > 0) commandPrefixStr += ' ';

                // Filter words matching the prefix
                matchingCommands = serverCommands.filter(cmd => 
                    cmd.toLowerCase().startsWith(currentPrefix.toLowerCase())
                );
                completionIndex = 0;
                lastTabPrintedList = false;
            }

            // Execute display updates if matches exist
            if (matchingCommands.length > 0) {
                // If there are multiple matches and we haven't shown them yet, list them Bash-style
                if (matchingCommands.length > 1 && !lastTabPrintedList) {
                    output.textContent += `\n${matchingCommands.join('    ')}\n`;
                    lastTabPrintedList = true;
                    window.scrollTo(0, document.body.scrollHeight);
                }

                // Inject selected match back into input stream
                this.value = commandPrefixStr + matchingCommands[completionIndex];
                completionIndex = (completionIndex + 1) % matchingCommands.length;
            }
            return;
        }

        if (e.key === 'Enter') {
            const command = this.value.trim();
            if (!command) return;

            output.textContent += `\npico-shell> ${command}\n`;
            this.value = '';

            // Clean up autocomplete scopes
            matchingCommands = [];
            lastTabPrintedList = false;

            history.push(command);
            historyIndex = history.length;

            try {
                await fetch('/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: command
                });
            } catch (err) {
                output.textContent += "System Error: Unable to transmit command.\n";
            }
            
            window.scrollTo(0, document.body.scrollHeight);

            if (command.includes("edit")) {
                window.location.href = "/edit.shtml";
            }
        } 
        
        else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                this.value = history[historyIndex];
            }
        } 
        
        else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex < history.length - 1) {
                historyIndex++;
                this.value = history[historyIndex];
            } else {
                historyIndex = history.length;
                this.value = '';
            }
        }
    });

    output.textContent = "Shell Ready. Waiting for data...\n";
    loadCompletionWords();
    listenForBackendUpdates();
</script>

</body>
</html>
