<style>
body {
  font-family: "Lato", sans-serif;
  font-size: 25px;
}

.sidenav {
  height: 100%;
  width: 160px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 120px;
}

.sidenav a {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.main {
  margin-left: 160px; /* Same as the width of the sidenav */
  font-size: 28px; /* Increased text to enable scrolling */
  input[type='text'] { font-size: 28px; }

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

<body onload="toggleColumn()">
<script>
  function toggleColumn() {
    const table = document.getElementById('automation_edit');
    if (!table) return;
    const rows = table.rows;
    for (let columnIndex = 3; columnIndex < 6; columnIndex++) {
      for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].cells;
          if (cells.length > columnIndex) {
              const cell = cells[columnIndex];
              const mode_selected = document.getElementById('tpsm');
              const selectedValue = mode_selected.value;
              if ((selectedValue === '1') || (selectedValue === '4')) {
                cell.style.display = 'none';  
              } else if ((selectedValue === '5') && (columnIndex == 3)) {
                cell.style.display = 'none';  
              } else if ((selectedValue !== '5') && (columnIndex > 3)) {
                cell.style.display = 'none';  
              } else {
                cell.style.display = '';
              }
          }
      }
    }
  }
</script>

  <div class="sidenav">

<div class="main">
  <h2>Edit Automation</h2>    
  <table id="automation_edit">
    <form action="/ts_change.cgi" method="get" name="events">
      <tr>
        <td><b>Day</b></td>
        <td><b>Time</b></td>
        <td><b>Mode</b></td>
        <td><b>Temperature</b></td>
        <td><b>Heating Temp</b></td>
        <td><b>Cooling Temp</b></td>                
        <td>&nbsp;</td>
      </tr>
      <tr> 
        <td>
          <!--#tday-->
        </td>
        <td>
          <input name="tpst" id="tspst" <!--#tpst--> value="<!--#tpst-->"/>  
        </td>  
        <td>
          <select id="tpsm" name="tpsm" onchange="toggleColumn();" onfocus="this.selectedIndex = -1;">
            <option value="0" <!--#tpsm1-->>Auto</option>
            <option value="1" <!--#tpsm2-->>Off</option>            
            <option value="2" <!--#tpsm3-->>Heat Only</option>
            <option value="3" <!--#tpsm4-->>Cool Only</option>
            <option value="4" <!--#tpsm5-->>Fan Only</option>     
            <option value="5" <!--#tpsm6-->>Heat & Cool</option>                      
        </select>
        </td>   
        <td>
          <input name="tptmp" id="tptmp" <!--#tptmp--> value="<!--#tptmp-->"/> 
        </td>
        <td>
          <input name="tphtmp" id="tphtmp" <!--#tphtmp--> value="<!--#tphtmp-->"/> 
        </td>
        <td>
          <input name="tpctmp" id="tpctmp" <!--#tpctmp--> value="<!--#tpctmp-->"/> 
        </td>                
        <td>
          <a href="/t_schedule.shtml">   <button type=button>Cancel</button></a> 
        </td>  
      <tr>
        <td>
        <input type="submit" style="font-size: 28px;" value="Save">
        </td>
      </tr>
    </form>
  </table>        
</div>
