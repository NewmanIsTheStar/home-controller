<style>
body {
  font-family: "Lato", sans-serif;
  font-size: 25px;
}

.sidenav {
  height: 100%;
  width: 160px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 120px;
}

.sidenav a {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.main {
  margin-left: 160px; /* Same as the width of the sidenav */
  font-size: 28px; /* Increased text to enable scrolling */
  input[type='text'] { font-size: 28px; }
  padding: 0px 10px;
   td {
    padding: 0 15px;
  }

    /* Container for the switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    /* Hide the default HTML checkbox */
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* The visible slider track */
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 26px;
    }

    /* The moving circular knob */
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    /* Track background color when checked */
    input:checked + .slider {
      background-color: #2196F3;
    }

    /* Knob position when checked */
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Base modern button styles */
    .btn-modern {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: #ffffff;
      background-color: #2563eb; /* Modern Royal Blue */
      border: none;
      border-radius: 6px; /* Soft rounded corners */
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
    }

    /* Hover state: gets slightly darker */
    .btn-modern:hover {
      background-color: #1d4ed8;
    }

    /* Active state: subtle tactile "click" press down effect */
    .btn-modern:active {
      transform: scale(0.98);
    }

    /* Focus state: accessibility ring for keyboard users */
    .btn-modern:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    .btn-modern.btn-danger {
      background-color: #dc2626; /* Crimson Red */
    }
    .btn-modern.btn-danger:hover {
      background-color: #b91c1c; /* Darker Red on Hover */
    }
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

<script>
document.getElementById('automation-table').addEventListener('change', function(event) {
  if (event.target.classList.contains('row-toggle')) {
    const checkbox = event.target;
    
    // Extract the exact index from the data-row attribute
    const rowNum = checkbox.dataset.row; 
    const state = checkbox.checked ? '1' : '0';

    fetch(`cgi_hc_automation_enable.shtml?row=${rowNum}&status=${state}`)
      .then(response => { if (!response.ok) checkbox.checked = !checkbox.checked; });
  }
});

</script>
